version: '3.8'

services:
  scraper:
    build: .
    container_name: climate-events-scraper
    env_file:
      - .env
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/app/credentials.json
    volumes:
      - ./credentials.json:/app/credentials.json
    ports:
      - "8080:8080"
    restart: unless-stopped