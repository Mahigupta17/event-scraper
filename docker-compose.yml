version: '3.8'

services:
  scraper:
    build: .
    container_name: climate-events-scraper
    
    # Port mapping
    ports:
      - "8080:8080"
    
    # Environment variables from .env file
    env_file:
      - .env
    
    # Mount the credentials file
    volumes:
      - ./sheet-scraper-bot-472309-de1c2aa26ac3.json:/app/credentials.json:ro
    
    # Set the credentials path
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/app/credentials.json
      - PORT=8080
    
    # Restart policy
    restart: unless-stopped
